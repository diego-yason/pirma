<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%" class="font-inter">
    <head>
        <meta charset="utf-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta name="text-scale" content="scale" />
        <script>
            // Apply the saved/system theme before first paint to avoid a flash
            // of the wrong theme. Light is the default; "dark" is only added
            // when the user has chosen dark or the system prefers it.
            (function () {
                try {
                    var stored = localStorage.getItem("theme");
                    var dark =
                        stored === "dark" ||
                        (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    if (dark) document.documentElement.classList.add("dark");
                } catch (e) {}
            })();
        </script>
        %sveltekit.head%
    </head>

    <body data-sveltekit-preload-data="hover" class="text-foreground-primary dark:bg-neutral-950">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
